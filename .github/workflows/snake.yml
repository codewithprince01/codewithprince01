name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Enhance Snake Aesthetics
        run: node scripts/beautify-snake.mjs

      - name: Push generated files
        run: |
          git config --global user.name 'codewithprince01'
          git config --global user.email 'codewithprince0@gmail.com'
          git pull --rebase --autostash
          git add output/
          git commit -m 'chore: update snake contribution graph' || echo "No changes to commit"
          git push
